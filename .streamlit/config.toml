[theme]

# Vibrant primary accent color for interactive elements
primaryColor = "#FF6B6B"  # Bright Coral Red

# Dark background for the main content area for contrast
backgroundColor = "#1E1E2E"  # Deep Indigo 

# Contrasting, elegant sidebar background
secondaryBackgroundColor = "#3A3D5B"  # Muted Dark Purple

# Bright, readable text color
textColor = "#F8F8F2"  # Soft Off-White

# Modern font choice
font = "sans serif"
